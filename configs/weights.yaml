# Released model weights (GitHub Release assets). Download with:
#   python -m telecomsafe.weights            # all
#   python -m telecomsafe.weights e3         # one
# The sha256 is checked after download; a mismatch means a corrupted or wrong file.
# `release` / `url` are the default release; a model with its own `release` key comes from that release instead.
# v1 (2026-09-29) weights stay available in the phase1-baseline-v1 release.


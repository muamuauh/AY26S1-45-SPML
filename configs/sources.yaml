    class_map:
      person: person
      vest: vest
      blue: helmet
      red: helmet
      white: helmet
      yellow: helmet
    annotates: [person, vest, helmet]
    notes: 没有 no_helmet 类，由 teacher 补伪标签。
    verified: false


# 数据来源登记表 —— 数据集信息的唯一出处
#
# 下载（telecomsafe.data.download）、构建（telecomsafe.data.build）和
# 数据集说明文档 data/README.md（telecomsafe.data.catalog 生成）都读这份文件。
#
# 字段说明
#   name          本地目录名，数据放在 path（默认 data/raw/<name>/）
#   tier          A 核心 | B 补充 | optional 可选 | eval 测试 | unused 未使用
#   role          train | eval | unused
#   enabled       是否参与构建（下载与文档不受影响）
#   format        yolo | coco | voc
#   names         YOLO 类别表的兜底值；数据集自带 data.yaml 时以其为准
#   class_map     原类别 → 目标类别（见 configs/taxonomy.yaml）；null 表示丢弃。
#                 构建时遇到这里没声明的原类别会直接报错，防止静默丢标注
#   annotates     该数据集"完整标注"了哪些目标类别；其余目标类别由 teacher 补伪标签
#   filter        no_person：丢弃含人的图（用于只标了机械的数据集）
#   download      method: kaggle | roboflow | ultralytics | url_zip | manual
#   verified      类别表与规模是否已按下载后的实际文件核对过
#   en            上面中文字段的英文版（title / description / licence / planned_size / notes / reason /
#                 instructions），用于生成英文的 data/README-EN.md；没有写的字段沿用原值

sources:
  # ------------------------------------------------------------------ A 核心
  - name: construction_site_safety
    title: Construction Site Safety (Roboflow Universe, version 30)
    en:
      description: "Roboflow's curated construction-site safety dataset (version 30, original un-augmented images) with positive and negative helmet / vest classes (NO-Hardhat, NO-Safety Vest), people, and fine-grained machinery and vehicles. Closest match to the phase 1 target classes and the only source of machinery and vehicles."
      planned_size: "717 images (train 521 / valid 114 / test 82)"
      notes: "Checked 2026-09-29: the Kaggle mirror used at first is Roboflow version 28, whose training split is 2,605 mosaics made from 521 originals x 5 augmented copies (mosaic, cutout, crop, rotation...). That broke the \"no augmentation\" E1 control and made the rules treat people and machines in different mosaic tiles as adjacent. Replaced with the un-augmented version 30 (717 images)."
    tier: A
    role: train
    enabled: true
    homepage: https://universe.roboflow.com/roboflow-universe-projects/construction-site-safety
    paper: null
    description: >-
      Roboflow 官方整理的工地安全数据集（version 30，未经增广的原始图像），包含安全帽 / 反光衣的正负类
      （NO-Hardhat、NO-Safety Vest），以及人员、细分的工程机械与车辆。与本项目阶段一的目标类别重合度最高，
      也是工程机械与车辆的唯一来源。
    licence: CC BY 4.0
    citation: "Construction Site Safety dataset (version 30), Roboflow Universe Projects, https://universe.roboflow.com/roboflow-universe-projects/construction-site-safety"
    planned_size: 717 张（train 521 / valid 114 / test 82）
    format: yolo
    path: data/raw/construction_site_safety
    download:
      method: roboflow
      workspace: roboflow-universe-projects
      project: construction-site-safety
      version: 30            # 未增广的原始版本；不要用 Kaggle 镜像（= version 28，训练集是马赛克增广副本）
    names: [Excavator, Gloves, Hardhat, Ladder, Mask, NO-Hardhat, NO-Mask, NO-Safety Vest, Person, SUV, Safety Cone, Safety Vest, bus, dump truck, fire hydrant, machinery, mini-van, sedan, semi, trailer, truck, truck and trailer, van, vehicle, wheel loader]
    class_map:
      Hardhat: helmet
      NO-Hardhat: no_helmet
      Safety Vest: vest
      NO-Safety Vest: no_vest
      Person: person
      Excavator: machinery
      wheel loader: machinery
      dump truck: machinery
      machinery: machinery
      SUV: vehicle
      bus: vehicle
      mini-van: vehicle
      sedan: vehicle
      semi: vehicle
      trailer: vehicle
      truck: vehicle
      truck and trailer: vehicle
      van: vehicle
      vehicle: vehicle
      Gloves: null
      Ladder: null
      Mask: null
      NO-Mask: null
      Safety Cone: null
      fire hydrant: null
    annotates: [person, helmet, no_helmet, vest, no_vest, machinery, vehicle]
    notes: >-
      核对（2026-09-29）：最初用的 Kaggle 镜像实为 Roboflow version 28，其训练集是 521 张原图各生成 5 个
      增广版本（马赛克、cutout、裁剪、旋转等）得到的 2,605 张拼图——既让 E1 不再是"无增广"对照，也让
      规则把不同子图里的人和机械误判为相邻。已换成未增广的 version 30（717 张）。
    verified: true

  - name: construction_ppe
    title: Ultralytics Construction-PPE
    en:
      description: "Ultralytics' curated construction PPE dataset from real sites, with compliant and non-compliant examples; labels helmets, vests, gloves, boots, goggles and their absence."
      planned_size: "1,416 images (train 1,132 / val 143 / test 141)"
      notes: "No no_vest or machinery classes; filled with teacher pseudo-labels. Checked 2026-09-28: 1,416 images, class order matches Ultralytics' construction-ppe.yaml; contains adjacent video frames across train / test, removed by de-duplication."
    tier: A
    role: train
    enabled: true
    homepage: https://docs.ultralytics.com/datasets/detect/construction-ppe
    paper: null
    description: >-
      Ultralytics 官方整理的施工 PPE 数据集，采集自真实工地，包含合规与不合规样本，
      标注了安全帽、反光衣、手套、靴子、护目镜及其缺失状态。
    licence: AGPL-3.0
    citation: "Ultralytics Construction-PPE dataset, https://docs.ultralytics.com/datasets/detect/construction-ppe"
    planned_size: 1,416 张（train 1,132 / val 143 / test 141）
    format: yolo
    path: data/raw/construction_ppe
    download:
      method: ultralytics
      yaml: construction-ppe.yaml
    names: [helmet, gloves, vest, boots, goggles, none, Person, no_helmet, no_goggle, no_gloves, no_boots]
    class_map:
      helmet: helmet
      vest: vest
      Person: person
      no_helmet: no_helmet
      gloves: null
      boots: null
      goggles: null
      none: null
      no_goggle: null
      no_gloves: null
      no_boots: null
    annotates: [person, helmet, no_helmet, vest]
    notes: >-
      没有 no_vest 与机械类别，由 teacher 补伪标签。下载后核对（2026-09-28）：1,416 张，类别顺序与
      Ultralytics 官方 construction-ppe.yaml 一致；含同一视频的相邻帧（跨 train / test），构建时去重。
    verified: true

  - name: harness_vgg2coco
    title: harness (vgg2coco, Roboflow Universe)
    en:
      description: "Published as a safety-harness dataset; version 1 has 2,582 images with classes harness / head / helmat."
      planned_size: "~1,000 images (actual 2,582)"
      reason: "Checked 2026-09-28: boxes labelled harness are actually hi-vis vests, not harnesses; helmat boxes include helmets held in the hand; all images are staged video frames of one person in one room. Labels contradict our criteria and the domain does not match, so it is not used."
    tier: unused
    role: unused
    enabled: false
    homepage: https://universe.roboflow.com/vgg2coco/harness-dyxml
    paper: null
    description: 名为安全带检测的数据集，实际下载 2,582 张（version 1），类别 harness / head / helmat。
    licence: CC BY 4.0
    citation: "harness dataset by vgg2coco, Roboflow Universe, https://universe.roboflow.com/vgg2coco/harness-dyxml"
    planned_size: 约 1,000 张（实际 2,582 张）
    format: yolo
    path: data/raw/harness_vgg2coco
    download:
      method: roboflow
      workspace: vgg2coco
      project: harness-dyxml
      version: 1
    class_map:
      harness: vest        # 核对发现：标成 harness 的实为反光背心
      head: no_helmet
      helmat: helmet       # 含手持未佩戴的安全帽，与判定标准冲突
    annotates: [vest, no_helmet, helmet]
    reason: >-
      下载后核对（2026-09-28）：标成 harness 的其实是反光背心而非安全带；helmat 框包含手持的安全帽；
      全部是同一室内场景、同一人的摆拍视频帧。标注语义与判定标准冲突，领域也不符，停用。
    verified: true

  - name: body_harness
    title: body_harness (Construction Images, Roboflow Universe)
    en:
      description: "796 images of construction workers wearing safety harnesses; classes safety harness and worker."
      planned_size: "796 images"
      notes: "Checked 2026-09-28: version 5, 796 images of full-body harnesses worn on real sites. Many images are adjacent frames of the same video (removed by de-duplication); a few people are unlabelled and get teacher pseudo-labels."
    tier: A
    role: train
    enabled: true
    homepage: https://universe.roboflow.com/construction-images/body_harness
    paper: null
    description: 796 张的施工人员安全带数据集，类别包含 safety harness 与 worker。
    licence: CC BY 4.0
    citation: "body_harness dataset by Construction Images, Roboflow Universe, https://universe.roboflow.com/construction-images/body_harness"
    planned_size: 796 张
    format: yolo
    path: data/raw/body_harness
    download:
      method: roboflow
      workspace: construction-images
      project: body_harness
      version: null
    class_map:
      safety harness: harness
      worker: person
    annotates: [harness, person]
    notes: >-
      下载后核对（2026-09-28）：version 5，796 张，标的是真实工地上穿戴的全身式安全带。
      大量图片是同一视频的相邻帧，构建时去重；少数图中的人员漏标，由 teacher 补伪标签。
    verified: true

  - name: work_at_height
    title: Work at Height Safety (Proyecto Prevencion Predictiva, Roboflow Universe, version 1)
    en:
      description: "12,805 images of work at height (scaffolding, ladders, mobile elevating work platforms) labelling person, helmet, harness, MEWP, ladder and scaffolding; 4,189 harness instances, the largest harness source available."
      planned_size: "12,805 images (version 1: train 8,964 / valid 2,561 / test 1,280)"
      notes: "Added 2026-10-05 before freezing the baseline. Version 1 (version 3 contains augmented copies) has 12,712 images, stretched to 640x640 like the other Roboflow exports, with 2,720 harness instances (the project page's 4,189 counts later versions). Harness labels checked by eye: correct, many tower, pole and aerial-platform scenes. About a fifth of the images are mirror-padded and many show only ladders or scaffolding, so only images with a harness are used (filter has:harness) minus 862 suspected mirror-padded ones (configs/exclude/work_at_height.txt)."
    tier: A
    role: train
    enabled: true
    homepage: https://universe.roboflow.com/proyecto-prevencion-predictiva/work-at-height-safety
    paper: null
    description: >-
      12,805 张高处作业图像（脚手架、梯子、高空作业平台），标注人员、安全帽、安全带、高空作业平台（MEWP）、
      梯子与脚手架；安全带 4,189 个实例，是目前能找到的最大安全带来源。
    licence: CC BY 4.0
    citation: "Work at Height Safety dataset (version 1) by Proyecto Prevencion Predictiva, Roboflow Universe, https://universe.roboflow.com/proyecto-prevencion-predictiva/work-at-height-safety"
    planned_size: 12,805 张（version 1：train 8,964 / valid 2,561 / test 1,280）
    format: yolo
    path: data/raw/work_at_height
    download:
      method: roboflow
      workspace: proyecto-prevencion-predictiva
      project: work-at-height-safety
      version: 1          # version 3 含增广副本，不用
    class_map:
      person: person
      helmet: helmet
      harness: harness
      mewp: machinery     # 高空作业平台按标注规范算工程机械
      ladder: null
      scaffolding: null
    annotates: [person, helmet, harness, machinery]   # mewp → machinery；teacher 不再补机械，避免平台被重复框
    filter: has:harness
    exclude: configs/exclude/work_at_height.txt
    notes: >-
      2026-10-05 加入（冻结 baseline 前加入）。version 1（version 3 含增广副本）实际 12,712 张，与其他 Roboflow 导出一样
      拉伸为 640×640，安全带 2,720 个实例（项目页面的 4,189 为后续版本）。目视核对：安全带标注正确，含大量登塔、爬杆、
      高空作业平台场景。约 1/5 的图带镜像填充，很多图只有梯子或脚手架，因此只用含安全带的图（filter has:harness），
      并剔除 862 张疑似镜像填充的图（configs/exclude/work_at_height.txt）。
    verified: true

  # ------------------------------------------------------------------ B 补充
  - name: construction_workers_fyp
    title: 3 Construction Workers (FYP, Roboflow Universe)
    en:
      description: "600 images of construction workers, including harness and no-helmet classes."
      planned_size: "600 images"
      notes: "Class list taken from search results; to be checked after download. The Roboflow project has no published version and cannot be exported (2026-09-28)."
    tier: B
    role: train
    enabled: false       # 该 Roboflow 项目没有发布任何版本，无法导出（2026-09-28）
    homepage: https://universe.roboflow.com/fyp-h6hxz/3-construction-workers
    paper: null
    description: 600 张的施工人员数据集，包含安全带与未戴安全帽等类别。
    licence: CC BY 4.0
    citation: "3 Construction Workers dataset by FYP, Roboflow Universe, https://universe.roboflow.com/fyp-h6hxz/3-construction-workers"
    planned_size: 600 张
    format: yolo
    path: data/raw/construction_workers_fyp
    download:
      method: roboflow
      workspace: fyp-h6hxz
      project: 3-construction-workers
      version: null
    class_map: {}          # 下载后按 data.yaml 的类别表填写
    annotates: [harness, no_helmet]
    notes: 类别表来自搜索结果，下载后核对。
    verified: false

  - name: apd
    title: APD — 施工人员安全帽与反光衣检测（Roboflow 私有项目）
    en:
      title: "APD — helmet and vest detection on construction workers (private Roboflow project)"
      description: "2,300 photos of real construction sites in China (mostly news photos with watermarks), labelling helmet, no helmet, vest and no vest; No_Vest boxes cover the torso without a vest, matching our criterion. Its 4,245 no-vest instances are the largest in all our data and the main source of the no_vest class. No person class; filled with teacher pseudo-labels."
      licence: "Private (Roboflow workspace fathorazi-nur-fajri/apd-8wyrt, shared with the team) — internal training only, not redistributed"
      planned_size: "2,300 images (train 1,610 / valid 460 / test 230)"
      instructions: "Get APD.v1i.yolov8.zip from the team-only shared folder (OneDrive / Teams) and extract it to data/raw/apd/."
      notes: "Checked 2026-09-28: good label quality; only 6 near-duplicates with other datasets and 30 internal duplicates. Images come from news websites (watermarked) and are not owned by the dataset author: cite the source in the report and never publish these images."
    tier: B
    role: train
    enabled: true
    homepage: null
    paper: null
    description: >-
      2,300 张真实国内工地照片（多为新闻图片，带网站水印），标注安全帽、未戴安全帽、反光衣、
      未穿反光衣；No_Vest 框住未穿反光衣的躯干，与判定标准一致。未穿反光衣样本（4,245 个）是
      全部数据中最多的，是 no_vest 类的主要来源。没有人员类，由 teacher 补伪标签。
    licence: 私有（Roboflow 工作区 fathorazi-nur-fajri/apd-8wyrt，他人分享）——仅限本项目内部训练，不再分发
    citation: "APD dataset v1 (Roboflow private project fathorazi-nur-fajri/apd-8wyrt), shared with the project team; used for internal training only."
    planned_size: 2,300 张（train 1,610 / valid 460 / test 230）
    format: yolo
    path: data/raw/apd
    download:
      method: manual
      instructions: 从组内共享文件夹（OneDrive / Teams，仅限组员）获取 APD.v1i.yolov8.zip，解压到 data/raw/apd/。
    names: [Helmet, No_Helmet, No_Vest, Vest]
    class_map:
      Helmet: helmet
      No_Helmet: no_helmet
      No_Vest: no_vest
      Vest: vest
    annotates: [helmet, no_helmet, vest, no_vest]
    notes: >-
      核对（2026-09-28）：标注质量好；与已有数据集近似重复仅 6 张，内部重复 30 张。
      图片来自新闻网站（带水印），版权不属于数据集作者：报告中注明来源，不公开发布这些图片。
    verified: true

  - name: construction_safety_v2
    title: construction safety v2 (yun-pl2q1, Roboflow Universe)
    en:
      description: "1,206 helmet-detection images labelling helmet, no helmet and person. Many stock / studio photos and fewer real sites; mainly adds helmet and person diversity. Visible vests are unlabelled and get teacher pseudo-labels."
      planned_size: "1,206 images (train 997 / valid 119 / test 90)"
      notes: "Checked 2026-09-28: export package provided by the user (data/other_data/); 24 near-duplicates with other datasets, 15 internal duplicates."
    tier: B
    role: train
    enabled: true
    homepage: https://universe.roboflow.com/yun-pl2q1/construction-safety-ejqd8
    paper: null
    description: >-
      1,206 张安全帽检测图像，标注安全帽、未戴安全帽和人员。含较多图库 / 棚拍照片，真实工地比例较低；
      主要补充安全帽与人员的多样性。图中可见的反光衣未标注，由 teacher 补伪标签。
    licence: CC BY 4.0
    citation: "construction safety dataset v2 by yun-pl2q1, Roboflow Universe, https://universe.roboflow.com/yun-pl2q1/construction-safety-ejqd8"
    planned_size: 1,206 张（train 997 / valid 119 / test 90）
    format: yolo
    path: data/raw/construction_safety_v2
    download:
      method: roboflow
      workspace: yun-pl2q1
      project: construction-safety-ejqd8
      version: 2
    names: [helmet, no-helmet, person]
    class_map:
      helmet: helmet
      no-helmet: no_helmet
      person: person
    annotates: [person, helmet, no_helmet]
    notes: 核对（2026-09-28）：由用户提供导出包（data/other_data/），与已有数据集近似重复 24 张，内部重复 15 张。
    verified: true

  - name: shel5k
    title: SHEL5K — Safety Helmet detection with Extended Labels
    en:
      description: "5,000 helmet images extending the Safety Helmet Detection dataset, labelling helmet, head, people with / without helmets and faces. No vest labels."
      planned_size: "5,000 images"
      instructions: "Download all files from the Mendeley page and extract to data/raw/shel5k/ (keep Annotations/ and the image folder)."
      notes: "Class names in the XML files decide; if the build reports an undeclared class, complete class_map as instructed."
    tier: B
    role: train
    enabled: true
    homepage: https://data.mendeley.com/datasets/9rcv8mm682/4
    paper: https://www.mdpi.com/1424-8220/22/6/2315
    description: >-
      在 Safety Helmet Detection 数据集基础上扩展标注的 5,000 张安全帽数据集，
      标注了安全帽、头部、戴 / 未戴安全帽的人和人脸。没有反光衣标注。
    licence: CC BY 4.0
    citation: "Otgonbold, M.-E. et al. SHEL5K: An Extended Dataset and Benchmarking for Safety Helmet Detection. Sensors 2022, 22(6), 2315."
    planned_size: 5,000 张
    format: voc
    path: data/raw/shel5k
    download:
      method: manual
      instructions: 打开 Mendeley 页面下载全部文件，解压到 data/raw/shel5k/（保留 Annotations/ 与图片目录）。
    class_map:
      helmet: helmet
      head: no_helmet
      person_with_helmet: person
      person_no_helmet: person
      head_with_helmet: null
      face: null
    annotates: [person, helmet, no_helmet]
    notes: XML 中的类别名以实际文件为准，构建报错时按提示补全 class_map。
    verified: false

  - name: chv
    title: CHV — Color Helmet and Vest
    en:
      description: "1,330 construction-site images selected from ~10,000 web and public images, labelling people, vests and helmets in four colours."
      licence: "Not stated (cite the paper as the authors request)"
      planned_size: "1,330 images"
      instructions: "Download from the Google Drive link in the GitHub README and extract to data/raw/chv/ (images/ and labels/ side by side)."
      notes: "No no_helmet class; filled with teacher pseudo-labels."
    tier: B
    role: train
    enabled: true
    homepage: https://github.com/ZijianWang-ZW/PPE_detection
    paper: https://www.mdpi.com/1424-8220/21/10/3478
    description: 从约 1 万张网络与公开数据中精选的 1,330 张工地图像，标注了人员、反光衣和四种颜色的安全帽。
    licence: 未注明（按作者要求引用论文）
    citation: "Wang, Z.; Wu, Y.; Yang, L.; Thirunavukarasu, A.; Evison, C.; Zhao, Y. Fast Personal Protective Equipment Detection for Real Construction Sites Using Deep Learning Approaches. Sensors 2021, 21, 3478."
    planned_size: 1,330 张
    format: yolo
    path: data/raw/chv
    download:
      method: manual
      instructions: 从 GitHub README 中的 Google Drive 链接下载，解压到 data/raw/chv/（images/ 与 labels/ 同级）。
    names: [person, vest, blue, red, white, yellow]
    class_map:
      person: person
      vest: vest
      blue: helmet
      red: helmet
      white: helmet
      yellow: helmet
    annotates: [person, vest, helmet]
    notes: 没有 no_helmet 类，由 teacher 补伪标签。
    verified: false

  - name: acid
    title: ACID — Alberta Construction Image Dataset
    en:
      description: "10,000 ground-level images of 10 kinds of construction machines. Only images without people are used, to diversify machinery."
      licence: "CC BY-NC 4.0 (non-commercial only)"
      planned_size: "10,000 images"
      instructions: "Request the download from the University of Alberta library as described on the R-Lab page, and extract to data/raw/acid/."
    tier: B
    role: train
    enabled: false         # 下载需要登记；有时间再启用
    homepage: https://profsckang.wixsite.com/uofa-rlab/copy-of-r-lab-design
    paper: https://ascelibrary.org/doi/abs/10.1061/(ASCE)CP.1943-5487.0000945
    description: 10,000 张地面视角的工程机械图像，共 10 类机械。只取不含人员的图补充机械多样性。

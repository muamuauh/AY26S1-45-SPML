      标注了安全帽、头部、戴 / 未戴安全帽的人和人脸。没有反光衣标注。
    licence: CC BY 4.0
    citation: "Otgonbold, M.-E. et al. SHEL5K: An Extended Dataset and Benchmarking for Safety Helmet Detection. Sensors 2022, 22(6), 2315."
    planned_size: 5,000 张
    format: voc
    path: data/raw/shel5k
    download:
      method: manual
      instructions: 打开 Mendeley 页面下载全部文件，解压到 data/raw/shel5k/（保留 Annotations/ 与图片目录）。
    class_map:
      helmet: helmet
      head: no_helmet
      person_with_helmet: person
      person_no_helmet: person
      head_with_helmet: null
      face: null
    annotates: [person, helmet, no_helmet]
    notes: XML 中的类别名以实际文件为准，构建报错时按提示补全 class_map。
    verified: false


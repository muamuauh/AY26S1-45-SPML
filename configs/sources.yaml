  - name: apd
    title: APD — 施工人员安全帽与反光衣检测（Roboflow 私有项目）
    tier: B
    role: train
    enabled: true
    homepage: null
    paper: null
    description: >-
      2,300 张真实国内工地照片（多为新闻图片，带网站水印），标注安全帽、未戴安全帽、反光衣、
      未穿反光衣；No_Vest 框住未穿反光衣的躯干，与判定标准一致。未穿反光衣样本（4,245 个）是
      全部数据中最多的，是 no_vest 类的主要来源。没有人员类，由 teacher 补伪标签。
    licence: 私有（Roboflow 工作区 fathorazi-nur-fajri/apd-8wyrt，他人分享）——仅限本项目内部训练，不再分发
    citation: "APD dataset v1 (Roboflow private project fathorazi-nur-fajri/apd-8wyrt), shared with the project team; used for internal training only."
    planned_size: 2,300 张（train 1,610 / valid 460 / test 230）
    format: yolo
    path: data/raw/apd
    download:
      method: manual
      instructions: 由他人分享的 Roboflow 导出包 data/other_data/APD.v1i.yolov8.zip，解压到 data/raw/apd/。
    names: [Helmet, No_Helmet, No_Vest, Vest]
    class_map:
      Helmet: helmet
      No_Helmet: no_helmet
      No_Vest: no_vest
      Vest: vest
    annotates: [helmet, no_helmet, vest, no_vest]
    notes: >-
      核对（2026-09-28）：标注质量好；与已有数据集近似重复仅 6 张，内部重复 30 张。
      图片来自新闻网站（带水印），版权不属于数据集作者：报告中注明来源，不公开发布这些图片。
    verified: true


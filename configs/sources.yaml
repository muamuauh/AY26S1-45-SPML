# 数据来源登记表 —— 数据集信息的唯一出处
#
# 下载（telecomsafe.data.download）、构建（telecomsafe.data.build）和
# 数据集说明文档 data/README.md（telecomsafe.data.catalog 生成）都读这份文件。
#
# 字段说明
#   name          本地目录名，数据放在 path（默认 data/raw/<name>/）
#   tier          A 核心 | B 补充 | optional 可选 | eval 测试 | unused 未使用
#   role          train | eval | unused
#   enabled       是否参与构建（下载与文档不受影响）
#   format        yolo | coco | voc
#   names         YOLO 类别表的兜底值；数据集自带 data.yaml 时以其为准
#   class_map     原类别 → 目标类别（见 configs/taxonomy.yaml）；null 表示丢弃。
#                 构建时遇到这里没声明的原类别会直接报错，防止静默丢标注
#   annotates     该数据集"完整标注"了哪些目标类别；其余目标类别由 teacher 补伪标签
#   filter        no_person：丢弃含人的图（用于只标了机械的数据集）
#   download      method: kaggle | roboflow | ultralytics | url_zip | manual
#   verified      类别表与规模是否已按下载后的实际文件核对过

sources:
  # ------------------------------------------------------------------ A 核心
  - name: construction_site_safety
    title: Construction Site Safety (Roboflow Universe, version 30)
    tier: A
    role: train
    enabled: true
    homepage: https://universe.roboflow.com/roboflow-universe-projects/construction-site-safety
    paper: null
    description: >-
      Roboflow 官方整理的工地安全数据集（version 30，未经增广的原始图像），包含安全帽 / 反光衣的正负类
      （NO-Hardhat、NO-Safety Vest），以及人员、细分的工程机械与车辆。与本项目阶段一的目标类别重合度最高，
      也是工程机械与车辆的唯一来源。
    licence: CC BY 4.0
    citation: "Construction Site Safety dataset (version 30), Roboflow Universe Projects, https://universe.roboflow.com/roboflow-universe-projects/construction-site-safety"
    planned_size: 717 张（train 521 / valid 114 / test 82）
    format: yolo
    path: data/raw/construction_site_safety
    download:
      method: roboflow
      workspace: roboflow-universe-projects
      project: construction-site-safety
      version: 30            # 未增广的原始版本；不要用 Kaggle 镜像（= version 28，训练集是马赛克增广副本）
    names: [Excavator, Gloves, Hardhat, Ladder, Mask, NO-Hardhat, NO-Mask, NO-Safety Vest, Person, SUV, Safety Cone, Safety Vest, bus, dump truck, fire hydrant, machinery, mini-van, sedan, semi, trailer, truck, truck and trailer, van, vehicle, wheel loader]
    class_map:
      Hardhat: helmet
      NO-Hardhat: no_helmet
      Safety Vest: vest
      NO-Safety Vest: no_vest
      Person: person
      Excavator: machinery
      wheel loader: machinery
      dump truck: machinery
      machinery: machinery
      SUV: vehicle
      bus: vehicle
      mini-van: vehicle
      sedan: vehicle
      semi: vehicle
      trailer: vehicle
      truck: vehicle
      truck and trailer: vehicle
      van: vehicle
      vehicle: vehicle
      Gloves: null
      Ladder: null
      Mask: null
      NO-Mask: null
      Safety Cone: null
      fire hydrant: null
    annotates: [person, helmet, no_helmet, vest, no_vest, machinery, vehicle]
    notes: >-
      核对（2026-09-29）：最初用的 Kaggle 镜像实为 Roboflow version 28，其训练集是 521 张原图各生成 5 个
      增广版本（马赛克、cutout、裁剪、旋转等）得到的 2,605 张拼图——既让 E1 不再是"无增广"对照，也让
      规则把不同子图里的人和机械误判为相邻。已换成未增广的 version 30（717 张）。
    verified: true

  - name: construction_ppe
    title: Ultralytics Construction-PPE
    tier: A
    role: train
    enabled: true
    homepage: https://docs.ultralytics.com/datasets/detect/construction-ppe
    paper: null
    description: >-
      Ultralytics 官方整理的施工 PPE 数据集，采集自真实工地，包含合规与不合规样本，
      标注了安全帽、反光衣、手套、靴子、护目镜及其缺失状态。
    licence: AGPL-3.0
    citation: "Ultralytics Construction-PPE dataset, https://docs.ultralytics.com/datasets/detect/construction-ppe"
    planned_size: 1,416 张（train 1,132 / val 143 / test 141）
    format: yolo
    path: data/raw/construction_ppe
    download:
      method: ultralytics
      yaml: construction-ppe.yaml
    names: [helmet, gloves, vest, boots, goggles, none, Person, no_helmet, no_goggle, no_gloves, no_boots]
    class_map:
      helmet: helmet
      vest: vest
      Person: person
      no_helmet: no_helmet
      gloves: null
      boots: null
      goggles: null
      none: null
      no_goggle: null
      no_gloves: null
      no_boots: null
    annotates: [person, helmet, no_helmet, vest]
    notes: >-
      没有 no_vest 与机械类别，由 teacher 补伪标签。下载后核对（2026-09-28）：1,416 张，类别顺序与
      Ultralytics 官方 construction-ppe.yaml 一致；含同一视频的相邻帧（跨 train / test），构建时去重。
    verified: true

  - name: harness_vgg2coco
    title: harness (vgg2coco, Roboflow Universe)
    tier: unused
    role: unused
    enabled: false
    homepage: https://universe.roboflow.com/vgg2coco/harness-dyxml
    paper: null
    description: 名为安全带检测的数据集，实际下载 2,582 张（version 1），类别 harness / head / helmat。
    licence: CC BY 4.0
    citation: "harness dataset by vgg2coco, Roboflow Universe, https://universe.roboflow.com/vgg2coco/harness-dyxml"
    planned_size: 约 1,000 张（实际 2,582 张）
    format: yolo
    path: data/raw/harness_vgg2coco
    download:
      method: roboflow
      workspace: vgg2coco
      project: harness-dyxml
      version: 1
    class_map:
      harness: vest        # 核对发现：标成 harness 的实为反光背心
      head: no_helmet
      helmat: helmet       # 含手持未佩戴的安全帽，与判定标准冲突
    annotates: [vest, no_helmet, helmet]
    reason: >-
      下载后核对（2026-09-28）：标成 harness 的其实是反光背心而非安全带；helmat 框包含手持的安全帽；
      全部是同一室内场景、同一人的摆拍视频帧。标注语义与判定标准冲突，领域也不符，停用。
    verified: true


# TelecomSafe 阶段二 · 风险场景规格库（Stage 0，草案 v0.1，2026-10-06）
#
# 每一项是一种生成任务：从哪些训练图出发、怎么改、标注怎么变、生成多少张、过哪些闸门。
# telecomsafe/gen/ 下的生成脚本按本文件执行，生成结果与本项 id 一起记录在每张图的 JSON 旁文件里。
#
# ⚠️ 目标数量（target）是暂定的：弱类别以 TelecomEval 冻结后 E2（3 个种子）的结果为准，再回来调整。
# 硬规则（任何一项都不得违反）：
#   - 底图（base）只能来自训练集 data/processed/yolo/images/train，绝不用验证集或 TelecomEval；
#   - 背景、参考图、LoRA 训练图必须先过 G0（与 TelecomEval pHash 去重）；
#   - 合成图只进训练集；验证集与 TelecomEval 全程纯真实。
#   - 类别自适应上限：每类合成实例 ≤ 真实训练实例 × 3 + 100（文档 03 §5.1）。

version: 0.1-draft

defaults:
  seed: 0                     # 每张图的种子 = defaults.seed + 序号，记录在旁文件里
  model: diffusers/stable-diffusion-xl-1.0-inpainting-0.1
  vae: madebyollin/sdxl-vae-fp16-fix
  steps: 30
  guidance: 7.0
  crop_scale: 4.0             # 以目标为中心裁出边长 = 目标边长 × crop_scale 的方块，放大到 1024 再重绘
  gates: [g0_leak, g1_semantic, g3_detector]   # G2（分布）按批次计算；G4（人工）按批次抽检

scenarios:
  # ---------------------------------------------------------------- 路线 ③ 局部重绘
  - id: remove_helmet
    route: inpaint
    targets: [no_helmet]
    target: 800
    base:
      require: [helmet]                 # 底图里要有安全帽
      helmet_height: [0.04, 0.30]       # 安全帽框高度占图高的范围（太小画不清，太大像特写）
      max_people: 4
    # 预研结论（2026-10-06，10 张图）：SAM 掩码 ∪ 略大于安全帽框的椭圆（只用 SAM 轮廓会画回帽子形状）；
    # 重绘强度 1.0；贴回前按掩码外一圈像素做颜色匹配（否则有光晕）；每个安全帽最多试 3 个种子，
    # 直到 E2 不再在原位置检出安全帽。7/10 效果好；失败：戴口罩的脸、示意图底图。
    # 首批（2026-10-06，telecomsafe.gen.inpaint，30 张底图）：约一半通过；G1 用 CLIP 判"裸头"即可区分
    # （失败 0–0.08，通过 0.80–0.99），目测通过图约 85% 质量好；"脸被遮住"的底图过滤误判太多，已改为只记录。
    g1_min: 0.5
    min_helmet_px: 40
    mask: {from: helmet, method: sam_union_ellipse, ellipse_pad: [0.12, 0.08, 0.12, 0.05], grow: 0.10}
    strength: 1.0
    guidance: 8.0
    retries: 3
    color_match: ring
    prompt: >-
      photo of a construction worker's bare head, short black hair visible on top of the head, no hat,
      no helmet, natural skin and hair, photorealistic, natural light, sharp focus
    negative: helmet, hard hat, hat, cap, beanie, hood, headwear, cartoon, drawing, blurry, deformed
    label: {remove: helmet, add: no_helmet, box: detector_or_head_estimate}
    g1_question: "Is this person wearing a hard hat or helmet?"   # 期望回答：no

  - id: remove_vest
    route: inpaint
    targets: [no_vest]
    target: 300
    # 有安全带的底图不用：重绘会把背心外的安全带带子一起抹掉，安全带标注就错了
    base: {require: [vest], exclude: [harness], vest_height: [0.12, 0.70], max_people: 3}
    min_vest_px: 60
    mask: {from: vest, method: sam, grow: 0.04}
    strength: 1.0
    guidance: 7.5
    retries: 3
    color_match: ring
    g1_min: 0.5
    # 首批（2026-10-07，30 张底图）：28 张通过 G1 + G3，目测约 80% 自然；格子衬衫会画出马赛克状像素块（已去掉），
    # 衣服会沿用背心的轮廓（有时像无袖马甲，但已不是反光衣，no_vest 标注仍正确）；CLIP 拦不住马赛克 → 靠 G4 抽检
    variables:
      garment: [dark grey work shirt, faded blue denim jacket, black hoodie, plain white t-shirt,
                olive green work jacket, navy blue polo shirt, brown canvas work jacket]
    prompt: >-
      construction worker wearing a {garment}, no high-visibility vest, no reflective strips,
      photorealistic, natural light
    negative: high-visibility vest, safety vest, reflective strips, neon yellow, orange vest, cartoon, blurry
    label: {remove: vest, add: no_vest, box: same}
    g1_question: "Is this person wearing a high-visibility safety vest?"   # 期望：no

  - id: add_harness
    route: inpaint
    targets: [harness]
    target: 600
    base:
      require: [person]
      exclude: [harness]
      person_height: [0.25, 0.95]       # 需要看得清躯干
      prefer_sources: [work_at_height, construction_site_safety]
    mask: {from: person, region: torso_and_thighs, method: sam}
    prompt: >-
      construction worker wearing a full-body fall-arrest safety harness with yellow webbing straps over the
      shoulders, across the chest and around the thighs, photorealistic
    negative: no harness, backpack, cartoon, blurry, deformed, extra limbs
    label: {add: harness, box: mask_bbox}
    g1_question: "Is this person wearing a full-body safety harness?"   # 期望：yes（检测器对安全带不可靠，主要靠 G1）

  # 添加类（telecomsafe.gen.insert）：以图中站着的人为参照定深度与大小，物体底边放在该人脚下，
  # 尺寸 h / w 以人的身高为单位（w 再随机乘 0.55–1.0 模拟斜视角）；不得遮挡已标注的物体。
  # 标注框 = 重绘后 SAM 在放置区域内分割出的紧框（不用 E2 检测框，避免只留下 E2 已会的样本）。
  - id: add_vehicle
    route: insert
    targets: [vehicle]
    target: 600
    # 首批（2026-10-07）：参照的人在脚手架 / 高空平台上 → 车悬在半空（17 张通过里只有 3–4 张合理）。
    # 因此只认脚在画面下部的人为"站在地面上"，排除以高处作业为主的数据集，并在重绘前用 CLIP 检查车轮处是地面。
    base: {require: [person], person_height: [0.08, 0.45], max_people: 6,
           exclude_sources: [work_at_height, body_harness]}
    ground_min: 0.5
    objects:
      - {name: white pickup truck, h: 1.05, w: 3.0}
      - {name: white delivery van, h: 1.2, w: 2.9}
      - {name: small box truck, h: 1.5, w: 3.6}
      - {name: silver sedan car, h: 0.85, w: 2.7}
      - {name: dark blue hatchback car, h: 0.85, w: 2.4}
      - {name: white utility van with roof rack, h: 1.25, w: 3.0}
    prompt: >-
      a {object} parked on the ground at a construction site, photorealistic, consistent lighting and
      perspective, natural shadow under the vehicle
    negative: toy, cartoon, floating, distorted, blurry, deformed, people, person
    strength: 1.0
    guidance: 7.5
    retries: 3
    crop_scale: 1.6
    color_match: ring
    g1_min: 0.5
    min_fill: 0.25

  - id: add_telecom_machinery
    route: insert
    targets: [machinery]
    target: 600
    base: {require: [person], person_height: [0.08, 0.45], max_people: 6,
           exclude_sources: [work_at_height, body_harness]}
    ground_min: 0.5
    objects:
      - {name: bucket truck with an aerial lift boom, h: 2.0, w: 4.0}
      - {name: cable drum trailer carrying a large cable reel, h: 1.2, w: 2.2}
      - {name: cable pulling winch truck, h: 1.6, w: 3.6}
      - {name: yellow mini excavator, h: 1.4, w: 2.2}
      - {name: truck-mounted crane, h: 2.0, w: 4.5}
    prompt: >-
      a {object} on the ground at a roadside telecom construction site, photorealistic, consistent lighting
      and perspective, natural shadow
    negative: toy, cartoon, floating, distorted metal, blurry, deformed, people, person
    strength: 1.0
    guidance: 7.5
    retries: 3
    crop_scale: 1.6
    color_match: ring
    g1_min: 0.5
    min_fill: 0.25

  # ---------------------------------------------------------------- 路线 ④ 场景迁移
  - id: telecom_scene_transfer
    route: scene_transfer             # telecomsafe.gen.scene
    targets: [person, helmet, no_helmet, vest, no_vest, harness]
    target: 500                       # 张数（图），标注全部继承
    base: {require: [person], person_height: [0.25, 0.90], max_people: 2}
    background:
      source: telecom_seed            # 第一轮被剔除、无人的电信候选图：CLIP 判为室外电信场景、E2 无目标类别、过 G0
    # 首批（2026-10-07，30 张）：17 张过 G1 + G3，目测约 40% 自然。问题：被遮挡 / 半身的人抠出来像漂浮的
    # 上半身或手；人太大像贴纸；CLIP 的"像不像贴上去"判断不出来。→ 只用 YOLO11-pose 确认全身站立的人，人缩小。
    # 第二批（60 张）：47 张底图无全身站立的人；12 张通过，目测约一半自然。剩余问题：特写背景（电缆盘）里人比例
    # 失真；脚落在铁塔 / 车旁半空。→ 背景池加 CLIP"远景 vs 特写"筛选；放置时 CLIP 检查脚下是地面（最多试 10 次）。
    # 第三批（100 张，背景池 127 → 86）：15 张通过，目测约 60–65% 自然。剩余问题：俯拍 / 航拍背景里站着的人
    # 像巨人；人占画面 40% 以上就像贴纸。→ 背景池排除俯拍，人物高度上限 0.45 → 0.38。
    # 第四批（100 张，背景池 81 张）：16 张通过，目测约 70% 自然；问题剩黑白老照片背景、蹲姿的人贴在物体上。
    # → 背景池排除黑白照片。
    person_height: [0.18, 0.38]       # 人物占背景高度的比例
    ground_min: 0.5                   # 脚下一条区域被 CLIP 判为地面的最低比例
    # 全量（3309 张底图，2026-10-07）：586 张通过，随机抽 24 张约 75% 自然；不自然的多为蹲 / 弯腰 / 举手的人、
    # 人偏大、小人被放大 3 倍以上发糊。→ 放大倍数上限 2.5（剔除 26 张）；姿势问题规则判不准，交给 G4。
    max_upscale: 2.5
    placements: 10
    recolor: 0.5                      # 人物颜色向背景统计量靠拢的比例
    harmonize_strength: 0.55          # 只重绘轮廓一圈与脚下阴影，人物本身不重绘（PPE 标注才能继承）
    crop_scale: 1.3
    min_fill: 0.3
    g1_min: 0.5
    prompt: >-
      photo of a construction worker standing on the ground outdoors, natural lighting, realistic soft shadow
      on the ground, photorealistic
    negative: cartoon, cut-out, sticker, halo, white outline, blurry, deformed, extra person

  - id: telecom_scene_generate
    route: scene_generate             # telecomsafe.gen.scene_gen
    # 贴真人（telecom_scene_transfer）G4 只有 9/99 自然（2026-10-07）：主要是大小 / 透视、光照 / 色调不一致。
    # → 改为在背景里直接画人：大小由单目度量深度定（f·H/Z），姿态来自训练集真人（OpenPose ControlNet），
    #   光照由 SDXL 结合周围画面统一生成；PPE 写在提示词里，E2 检出结果与提示词一致才保留。
    targets: [person, helmet, no_helmet, vest, no_vest]
    target: 500
    person_height: [0.08, 0.6]        # 由深度算出的人高须落在背景高度的这一范围
    fov: 65                           # 无 EXIF 焦距时假设的水平视场角
    placements: 30
    ground_min: 0.5
    crop_scale: 2.0
    min_crop: 512
    control_scale: 0.8
    strength: 1.0
    guidance: 7.0
    min_height_ratio: 0.75            # E2 检出的人高 / 计划人高
    max_height_ratio: 1.25
    retries: 2                        # 失败（没画出人 / PPE 不符 / 大小不符）时换种子重试
    ppe:
      # 首批 12 张：写"no hat"仍会画出安全帽（提示词里出现 hat 反而触发）→ 无帽 / 无背心只描述头发和衣服，
      # 安全帽 / 反光衣放进该项的负向提示词
      - {text: "a yellow hard hat and an orange high-visibility safety vest", helmet: true, vest: true}
      - {text: "a white hard hat and a yellow reflective safety vest", helmet: true, vest: true}
      - {text: "a white hard hat and a plain dark blue work jacket", helmet: true, vest: false,
         negative: "safety vest, high-visibility vest, reflective vest, reflective stripes"}
      - {text: "short hair, bareheaded, and an orange high-visibility safety vest", helmet: false, vest: true,
         negative: "hard hat, helmet, hat, cap, headwear"}
      - {text: "short hair, bareheaded, a plain grey t-shirt and work trousers", helmet: false, vest: false,
         negative: "hard hat, helmet, hat, cap, headwear, safety vest, high-visibility vest, reflective stripes"}
    prompt: >-
      photo of a telecom technician standing on the ground, with {ppe}, full body, natural lighting
      matching the scene, realistic shadow on the ground, photorealistic
    negative: cartoon, drawing, cut-out, sticker, blurry, deformed, extra limbs, extra person, floating, oversized

  - id: weather_lighting
    route: img2img
    targets: [all]
    target: 300
    base: {any: true}
    prompt: "{condition}, photorealistic"
    variables: {condition: [light rain, fog, overcast dusk, night with work lights, strong backlight]}
    strength: [0.25, 0.40]
    label: {keep: all}

  # ---------------------------------------------------------------- 路线 ①（可选，W10 有余力时）
  - id: t2i_tower_climber
    route: t2i
    optional: true
    targets: [person, harness, helmet, no_helmet]
    target: 200
    requires: [telecom_lora]
    prompt: >-
      tlcmsite, {view}, a technician climbing a lattice telecommunication tower {ppe}, steel lattice with antennas,
      {weather}, photorealistic documentary photograph
    variables:
      view: [ground-level upward view, side view from the tower, distant view]
      ppe: [wearing a helmet and a full-body harness, wearing a harness but no helmet, without a harness]
      weather: [clear sky, overcast sky, light rain]
    label: {method: autolabel}          # YOLO-World / Grounding DINO + E2 + 与提示词一致性核对

gates:
  g0_leak: {phash_threshold: 8}                      # 与 TelecomEval（已选定的 167 张）比对
  g1_semantic: {clip_min: 0.25, vlm: Qwen/Qwen2.5-VL-3B-Instruct}
  g2_distribution: {metric: kid, max_kid: 0.05, max_fid: 50}   # 按批次（每个 scenario）计算
  g3_detector: {weights: runs/phase1/e2/weights/best.pt, conf: 0.25}   # 只剔除极端失败
  # 每个 scenario 随机抽 100 张，自然 / 不自然二选一（telecomsafe.gen.g4）；按 Wilson 95% 区间报告自然比例。
  # 5% 抽样在 500 张的批次里只有 25 张，区间太宽；5 级打分单人难以前后一致 → 改为固定 100 张 + 二分。
  g4_human: {sample: 100, scale: [natural, unnatural], rerate_after_days: 7, rerate_count: 50}   # 单人自评 + 盲评复评
